<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amazon MX Deals</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">MX</span>
      <div>
        <h1>Amazon México · Deals</h1>
        <p class="tagline">Vinyl · CD · Games — rastreador local · Last.fm</p>
      </div>
    </div>
    <div class="stats" id="stats">Cargando…</div>
  </header>

  <section class="filters" aria-label="Filtros">
    <div class="tabs" role="tablist">
      <button class="tab active" data-category="all" type="button">Todos</button>
      <button class="tab" data-category="vinyl" type="button">Vinyl</button>
      <button class="tab" data-category="cd" type="button">CD</button>
      <button class="tab" data-category="game" type="button">Games</button>
    </div>

    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="freeShipping" checked />
        <span>Envío gratis</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="priceErrorOnly" />
        <span>Solo price error</span>
      </label>
      <label class="toggle" title="Ordenar por afinidad Last.fm">
        <input type="checkbox" id="matchLastfm" />
        <span>Match Last.fm</span>
      </label>
      <label class="field">
        <span>Mín. Last.fm</span>
        <input type="number" id="minLastfm" min="0" max="100" step="1" placeholder="0" />
      </label>
      <label class="field">
        <span>Máx. total MXN</span>
        <input type="number" id="maxTotal" min="0" step="1" placeholder="ej. 500" />
      </label>
      <label class="field grow">
        <span>Buscar</span>
        <input type="search" id="search" placeholder="título o artista…" />
      </label>
      <label class="field">
        <span>Orden</span>
        <select id="sort">
          <option value="price" selected>Precio</option>
          <option value="total">Total</option>
          <option value="found_at">Más reciente</option>
          <option value="lastfm_match">Match Last.fm</option>
        </select>
      </label>
    </div>
  </section>

  <main>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty hidden">No hay deals con estos filtros.</p>
  </main>

  <footer>
    <span>API: <code>/api/items</code> · <code>/api/taste</code> · Melanio puede hacer POST upsert</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
